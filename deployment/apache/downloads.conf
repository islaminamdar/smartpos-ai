# Include before the existing ProxyPass / rule in this POS HTTPS virtual host.
# Only public release artifacts belong here; never place signing keys in this path.
ProxyPass /downloads/ !
AliasMatch ^/downloads/$ /var/www/internext-pos-downloads/index.html
Alias /downloads/ /var/www/internext-pos-downloads/
<Directory "/var/www/internext-pos-downloads">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    DirectoryIndex index.html
    Require all denied
    ErrorDocument 403 default
    <FilesMatch "^(index\.html|release\.json|internext-pos-counter-[0-9]+\.[0-9]+\.[0-9]+\.apk)$">
        <RequireAll>
            Require all granted
            Require method GET HEAD
        </RequireAll>
    </FilesMatch>
    AddType application/vnd.android.package-archive .apk
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    Header always set Cache-Control "no-cache"
</Directory>
