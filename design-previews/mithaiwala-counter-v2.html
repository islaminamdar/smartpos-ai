<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suleman Usman Mithaiwala — Counter concept</title>
<style>
:root{--ink:#28171d;--cream:#fff9f5;--paper:#fff;--line:#eadfe2;--maroon:#9e174f;--maroon-2:#73103a;--saffron:#c67a19;--pista:#52744c;--soft:#f9eef2;--muted:#77666d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr 28px}.top{display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;min-width:310px;font-weight:800;font-size:17px}.brand img{width:37px;height:37px;border-radius:50%;object-fit:cover}.brand>div{min-width:0}.brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px}.top-spacer{flex:1;min-width:0}.shift,.connection,.account{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;font-weight:750;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--pista)}.shift{color:#fff;background:var(--maroon);border-color:var(--maroon)}.account{border:0;background:transparent}.work{display:grid;grid-template-columns:112px minmax(0,1fr) 400px;min-height:0}.rail{background:#fff;border-right:1px solid var(--line);padding:13px 8px;display:flex;flex-direction:column;gap:5px;overflow:auto}.rail button{border:0;background:transparent;color:#67575d;min-height:48px;border-radius:10px;text-align:left;padding:8px 10px;font:700 12px/1.15 inherit;cursor:pointer}.rail button.active{background:#f7e6ed;color:var(--maroon)}.rail button span{display:block;font-size:19px;margin-bottom:3px}.canvas{padding:18px 20px 24px;min-width:0;overflow:auto}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;align-items:center;margin-bottom:15px}.search{height:48px;border:1px solid #d8cbd0;border-radius:12px;padding:0 15px;font:inherit;background:#fff;color:var(--ink)}.compact{height:48px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:#fff;font:750 13px inherit;color:var(--ink)}.modes{display:flex;gap:8px;margin:0 0 17px}.mode{border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 16px;background:#fff;font:800 13px inherit;color:var(--ink)}.mode.active{background:var(--maroon);border-color:var(--maroon);color:#fff}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}.heading h1{font-size:22px;letter-spacing:-.5px;margin:0}.heading p{margin:0;color:var(--muted);font-size:13px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}.product{position:relative;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 2px 6px #42202e08}.product img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f5f0ea}.product .copy{padding:10px 10px 12px;min-height:76px}.product strong{display:block;font-size:13px;line-height:1.3;min-height:34px}.product .price{display:block;color:var(--maroon);font-weight:850;font-size:13px;margin-top:6px}.add{position:absolute;right:9px;bottom:10px;width:29px;height:29px;border:0;border-radius:50%;background:var(--maroon);color:#fff;font-size:21px;line-height:1;box-shadow:0 4px 8px #9e174f48}.ticket{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.ticket-head{padding:16px 18px 13px;border-bottom:1px solid var(--line)}.ticket-head div{display:flex;align-items:center;justify-content:space-between}.ticket h2{font-size:20px;margin:0}.new{border:1px solid #e4d1da;border-radius:9px;padding:8px 10px;background:#fff;color:var(--maroon);font:800 12px inherit}.ticket-meta{display:flex;gap:7px;margin-top:12px}.ticket-meta span{background:var(--soft);border-radius:99px;padding:6px 9px;font-size:12px;font-weight:750;color:var(--maroon)}.lines{padding:6px 18px;flex:1;overflow:auto}.empty{height:100%;min-height:210px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty .bag{font-size:40px;display:block;margin-bottom:10px}.line{display:grid;grid-template-columns:1fr auto;gap:4px;padding:13px 0;border-bottom:1px solid #f0e7e9}.line strong{font-size:14px}.line small{color:var(--muted)}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800}.total{padding:14px 18px 17px;border-top:1px solid var(--line);background:#fff}.money{background:#fff5e9;border-radius:13px;padding:11px 12px;margin-bottom:11px}.money small{display:block;color:#695544;font-size:11px;font-weight:700}.money strong{display:block;color:var(--maroon);font-size:27px;line-height:1.2;margin-top:2px}.paytypes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.paytypes button{border:1px solid var(--line);border-radius:9px;background:#fff;min-height:42px;font:750 12px inherit}.paytypes button.active{background:#f6e4ed;color:var(--maroon);border-color:#dcb3c5}.pay{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--saffron);color:#fff;font:850 16px inherit;box-shadow:0 6px 14px #c67a1942}.footer{display:flex;align-items:center;padding:0 15px;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px;font-weight:700}.footer span{margin-left:auto}.mobile-cart{display:none}
@media(max-width:1179px){.work{grid-template-columns:82px minmax(0,1fr) 350px}.rail button{padding:7px;text-align:center}.rail button span{font-size:18px}.rail button{font-size:10px}.products{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.brand{min-width:auto}.account{display:none}}
@media(max-width:767px){body{font-size:14px}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px 1fr;overflow-x:hidden}.top,.work{min-width:0;width:100%}.top{padding:0 12px}.brand{font-size:14px;min-width:0;overflow:hidden}.brand>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand img{width:31px;height:31px}.brand small,.connection,.shift{display:none}.work{display:block}.rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:7px 8px;overflow:auto}.rail button{min-width:75px;min-height:44px;font-size:10px}.rail button span{font-size:15px;margin:0}.canvas{padding:12px 12px 84px}.toolbar{grid-template-columns:1fr auto}.toolbar .compact:last-child{display:none}.modes{overflow:auto}.mode{flex:0 0 auto}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ticket{display:none}.mobile-cart{display:flex;align-items:center;justify-content:space-between;position:fixed;bottom:10px;left:10px;right:10px;z-index:3;border:0;border-radius:13px;background:var(--maroon);color:#fff;padding:12px 15px;font:800 14px inherit;box-shadow:0 12px 28px #40132b40}.footer{display:none}.heading h1{font-size:20px}}

/* Bright counter direction: vivid, cheerful, and still legible for a busy shift. */
:root{--cream:#fffaf2;--ink:#25223d;--line:#e7dff6;--maroon:#ec1675;--maroon-2:#c90858;--saffron:#ff9d13;--pista:#00a991;--soft:#fff0f7;--muted:#6b6883}
.top{background:linear-gradient(90deg,#fff 0%,#fff8fc 58%,#f2ffff 100%);border-top:6px solid #ff9d13}.brand{color:#4c1675}.brand img{box-shadow:0 0 0 3px #fff,0 0 0 5px #ec1675}.connection{background:#e9fff9;border-color:#a9f0df;color:#087966}.shift{background:linear-gradient(135deg,#ec1675,#ae20bf);border:0;box-shadow:0 6px 14px #ec167540}.rail{background:linear-gradient(180deg,#fff 0%,#fffaff 100%)}.rail button{color:#625d7b}.rail button.active{background:#ffe2f0;color:#d10a63}.rail button:nth-child(2) span{color:#ec1675}.rail button:nth-child(3) span{color:#ff711e}.rail button:nth-child(4) span{color:#8048e8}.rail button:nth-child(5) span{color:#00a991}.rail button:nth-child(6) span{color:#ef3d65}.rail button:nth-child(7) span{color:#e4a409}.rail button:nth-child(8) span{color:#139ddd}.mode.active{background:linear-gradient(135deg,#ec1675,#c311a1);border:0;box-shadow:0 5px 12px #ec167536}.product{border-color:#ebe3f3;box-shadow:0 4px 12px #49285812}.product:hover{transform:translateY(-2px);box-shadow:0 9px 22px #ec167526}.product .price{color:#d80b69}.add{background:linear-gradient(135deg,#ff9d13,#ff6422);box-shadow:0 5px 11px #ff782d59}.ticket{border-left-color:#dfd5f0}.ticket-head{background:linear-gradient(120deg,#fff 0%,#fff4fa 100%)}.ticket-meta span{background:#ffe0ef;color:#d10a63}.money{background:linear-gradient(115deg,#fff1ce,#ffe5f1)}.money strong{color:#a90c70}.pay{background:linear-gradient(135deg,#ff9d13,#ff6422);box-shadow:0 8px 17px #ff782d54}.paytypes button.active{background:#e4fff8;border-color:#80e7d2;color:#007d69}.mobile-cart{background:linear-gradient(135deg,#ec1675,#9b21c9);box-shadow:0 12px 28px #a1127447}
</style>
</head><body><main class="app"><header class="top"><div class="brand"><img src="../public/pos-assets/brand/mithaiwala.webp" alt=""><div>Suleman Usman Mithaiwala<small>Bur Dubai · Front counter</small></div></div><span class="top-spacer"></span><span class="connection"><i class="dot"></i>Connected</span><button class="shift">● Shift open</button><span class="account">Manager ▾</span></header><div class="work"><nav class="rail" aria-label="Menu categories"><button class="active"><span>✦</span>All items</button><button><span>◉</span>Mithai</button><button><span>◒</span>Chaat</button><button><span>◈</span>Breakfast</button><button><span>◌</span>Biryani</button><button><span>◍</span>Curries</button><button><span>◐</span>Breads</button><button><span>◉</span>Drinks</button></nav><section class="canvas"><div class="toolbar"><input class="search" type="search" placeholder="Search dishes, sweets or code"><button class="compact">⌕ Scan / search</button><button class="compact">Last receipt</button></div><div class="modes"><button class="mode active">Takeaway</button><button class="mode">Dine-in</button><button class="mode">Delivery</button></div><div class="heading"><h1>Popular right now</h1><p>Tap an item to add it</p></div><div class="products" id="products"></div></section><aside class="ticket"><div class="ticket-head"><div><h2>Today’s order</h2><button class="new">New order</button></div><div class="ticket-meta"><span>Takeaway</span><span>Counter 1</span></div></div><div class="lines" id="lines"><div class="empty"><div><span class="bag">🛍</span><strong>Your order is empty</strong><br><small>Choose items from the menu</small></div></div></div><div class="total"><div class="money"><small>VAT included</small><strong id="total">AED 0.00</strong></div><div class="paytypes"><button class="active">Cash</button><button>Card</button><button>Split</button></div><button class="pay" id="pay">Take payment · AED 0.00</button></div></aside></div><button class="mobile-cart" id="mobile">Order · 0 <span>AED 0.00 →</span></button><footer class="footer">Business day · Bur Dubai <span>Preview only — no sale or data changes</span></footer></main><script>
const menu=[['Butter Chicken','35.00','I351571363A.webp'],['Veg Hakka Noodle','20.00','I996435623A.webp'],['Bhurji 4 Pav','20.00','I369004718A.webp'],['Masala Puri Gravy','15.00','I650739792A.webp'],['Chicken White Karahi','35.00','I674240347A.webp'],['Rasgulla · per piece','10.00','I873321820A.webp'],['Dal Fry','15.00','I538639298A.webp'],['Chicken Korma','35.00','I470218754A.webp'],['Mutton Korma','35.00','I949816932A.webp'],['Malpua with Rabdi','25.00','I253387567A.webp']];let cart=[];const products=document.querySelector('#products'),lines=document.querySelector('#lines');function money(n){return `AED ${n.toFixed(2)}`}function render(){products.innerHTML=menu.map((m,i)=>`<button class="product" data-i="${i}"><img src="../public/pos-assets/menu/${m[2]}" alt=""><div class="copy"><strong>${m[0]}</strong><span class="price">AED ${m[1]}</span></div><span class="add">+</span></button>`).join('');let total=cart.reduce((a,x)=>a+x.price*x.qty,0);lines.innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><div><strong>${x.name}</strong><small> AED ${x.price.toFixed(2)} each</small><div class="qty"><button data-minus="${i}">−</button><b>${x.qty}</b><button data-plus="${i}">+</button></div></div><strong>${money(x.price*x.qty)}</strong></div>`).join(''):'<div class="empty"><div><span class="bag">🛍</span><strong>Your order is empty</strong><br><small>Choose items from the menu</small></div></div>';document.querySelector('#total').textContent=money(total);document.querySelector('#pay').textContent=`Take payment · ${money(total)}`;document.querySelector('#mobile').innerHTML=`Order · ${cart.reduce((a,x)=>a+x.qty,0)} <span>${money(total)} →</span>`;document.querySelectorAll('.product').forEach(b=>b.onclick=()=>{let m=menu[b.dataset.i],existing=cart.find(x=>x.name===m[0]);existing?existing.qty++:cart.push({name:m[0],price:+m[1],qty:1});render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[b.dataset.plus].qty++;render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let x=cart[b.dataset.minus];x.qty--;if(!x.qty)cart.splice(b.dataset.minus,1);render()})}render()
</script></body></html>
